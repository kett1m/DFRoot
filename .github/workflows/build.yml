name: Build

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-lkms:
    name: LKMs / ${{ matrix.kmi }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
          - android17-6.18
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260828
      options: --privileged
    steps:
      - uses: actions/checkout@v7

      - name: Build dfroot.ko
        run: |
          cd lkm
          make -j$(nproc)
          llvm-objcopy --strip-unneeded \
            -R .comment -R .note.gnu.build-id -R .note.gnu.property \
            -R .note.Linux -R .note.GNU-stack \
            -R .BTF -R .BTF.base -R .llvm_addrsig \
            -R .hyp.text -R .hyp.bss -R .hyp.rodata -R .hyp.event_ids \
            -R .hyp.patchable_function_entries -R .hyp.data dfroot.ko
          mkdir -p $GITHUB_WORKSPACE/out
          cp dfroot.ko $GITHUB_WORKSPACE/out/dfroot-${{ matrix.kmi }}.ko
          make clean

      - name: Upload dfroot.ko
        uses: actions/upload-artifact@v7
        with:
          name: df-lkm-${{ matrix.kmi }}
          path: out/dfroot-${{ matrix.kmi }}.ko

  build-dfroot:
    needs: build-lkms
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate signing config
        run: |
          if [ "${{ secrets.KEYSTORE }}" = "" ]; then
            echo "::error::Signing secrets not configured. KEYSTORE secret is required for release builds."
            exit 1
          fi

      - name: Create signing.properties
        run: |
          echo KEYSTORE_FILE=../keystore.jks > signing.properties
          echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} >> signing.properties
          echo KEY_ALIAS=${{ secrets.KEY_ALIAS }} >> signing.properties
          echo KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} >> signing.properties
          echo ${{ secrets.KEYSTORE }} | base64 --decode > keystore.jks

      - name: Download DF LKMs
        uses: actions/download-artifact@v7
        with:
          pattern: df-lkm-*
          merge-multiple: true
          path: app/src/main/jni/ko/

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android NDK
        shell: bash
        run: |
          set -euo pipefail
          ndk_version="27.0.12077973"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          if [ -z "${sdk_root}" ]; then
            echo "::error::Android SDK path is not configured on the runner."
            exit 1
          fi

          sdkmanager_bin="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "${sdkmanager_bin}" ]; then
            sdkmanager_bin="$(command -v sdkmanager || true)"
          fi

          if [ -z "${sdkmanager_bin}" ]; then
            echo "::error::sdkmanager is not available on the runner."
            exit 1
          fi

          for attempt in 1 2 3; do
            if "${sdkmanager_bin}" --install "ndk;${ndk_version}"; then
              exit 0
            fi

            rm -rf "${sdk_root}/ndk/${ndk_version}"
            sleep $((attempt * 10))
          done

          echo "::error::Failed to install NDK ${ndk_version} after three attempts."
          exit 1

      - uses: gradle/actions/setup-gradle@v6

      - name: Build DFRoot APK
        run: ./gradlew :app:assembleRelease

      - name: Upload DFRoot APK
        uses: actions/upload-artifact@v7
        with:
          name: DFRoot
          path: app/build/outputs/apk/release/DFRoot_*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/DFRoot_*.apk
